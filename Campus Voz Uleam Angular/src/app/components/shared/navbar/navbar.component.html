<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/" class="brand-link">
        🎓 Campus Voz
      </a>
    </div>

    <div class="nav-menu" [class.active]="menuAbierto">
      <a routerLink="/" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        🏠 Inicio
      </a>
      <a routerLink="/publicaciones" class="nav-link" routerLinkActive="active">
        📝 Publicaciones
      </a>
      
      <!-- Este menú se muestra si el usuario ha iniciado sesión -->
      <div *ngIf="usuario; else notLoggedIn" class="user-menu">
        <a routerLink="/nueva-publicacion" class="nav-link btn-primary">
          ➕ Nueva
        </a>
        <div class="dropdown">
          <button class="user-button" (click)="toggleMenu()">
            <div class="user-avatar">{{ usuario.nombre.charAt(0).toUpperCase() }}</div>
            <span>{{ usuario.nombre }}</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="dropdown-menu" [class.show]="menuAbierto">
            <a routerLink="/perfil" class="dropdown-item" (click)="toggleMenu()">
              👤 Mi Perfil
            </a>
            <!-- El botón de logout ya no tiene un evento click, será manejado por el Shell -->
            <button class="dropdown-item logout-btn">
              🚪 Cerrar Sesión
            </button>
          </div>
        </div>
      </div>

      <!-- Este bloque se muestra si no hay usuario -->
      <ng-template #notLoggedIn>
        <!-- Los enlaces de login/register se eliminan porque son responsabilidad del Shell -->
      </ng-template>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
